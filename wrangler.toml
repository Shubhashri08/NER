#:schema node_modules/wrangler/config-schema.json
name = "silver-sniffle"
main = "backend/app/main.py"
compatibility_date = "2024-09-23"
compatibility_flags = ["python_workers"]

# Cloudflare Python Workers package declaration
requirements = "requirements.txt"


# Unified Single-Worker: Serve React Frontend directly from the same Worker domain
[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"

[vars]
PROJECT_NAME = "AI-Powered Disaster Logistics & Response Coordination Platform"
API_V1_STR = "/api/v1"
SECRET_KEY = "DISASTER_COORDINATION_SECURE_JWT_SECRET_2026_HEX"
GEMINI_MODEL = "gemini-3.8-flash"
OPENAI_MODEL = "gpt-4o-mini"
